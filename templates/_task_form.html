{% load flauna %}
<form method="post" action="{{ action }}" class="surface form-panel">
  {% csrf_token %}
  <div class="form-panel__head">
    <span class="form-panel__icon">{% icon "plus" 18 %}</span>
    <h3 class="section-title section-title--inside">{{ heading }}</h3>
  </div>
  <div class="form-grid">
    {% for f in task_form %}
      <div class="field">
        <label for="{{ f.id_for_label }}">{{ f.label }}</label>
        {{ f }}
        {% if f.help_text %}<p class="field-help">{{ f.help_text }}</p>{% endif %}
        {% if f.errors %}<p class="field-error">{{ f.errors|join:", " }}</p>{% endif %}
      </div>
    {% endfor %}
  </div>
  <button class="button button-primary">{% icon "plus" 16 %} Adaugă</button>
</form>
